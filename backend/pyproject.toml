[project]
name = "chat-pal-backend"
version = "1.0.0"
description = "Production backend for the Chat Pal autonomous agent application"
requires-python = ">=3.11"

[tool.ruff]
line-length = 100
target-version = "py311"
exclude = [".venv", "__pycache__"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "SIM", "RET", "C4", "S", "N", "A", "ARG", "PTH"]
ignore = [
  "E501",
  "UP035",
  "UP006",
  "UP007",
  "UP045",
  "B008",
  "SIM108",
  "RET504",
  "S101",
  "N818",
  "A002",
  "A003",
  "PTH123",
  "PTH118",
  "PTH120",
  "PTH110",
  "PTH112",
  "PTH113",
  "PTH114",
  "PTH100",
  "PTH103",
  "PTH107",
  "PTH204",
  "S108",
  "S110",
  "S311",
  "SIM103",
  "SIM105",
  "UP017",
  "UP037",
  "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["ARG", "S", "N", "PTH", "B011", "B015"]

[tool.ruff.lint.flake8-tidy-imports]
ban-relative-imports = "all"

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
filterwarnings = ["error::DeprecationWarning:app.*"]
